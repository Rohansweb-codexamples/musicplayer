<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rohans Web Media Player</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- jsmediatags to read file properties -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
    <style>
        :root {
            --accent: #fbbf24; 
            --vlc-bg: #0a0a0a;
            --vlc-surface: #161616;
        }

        body.theme-yellow { --accent: #fbbf24; }
        body.theme-pink { --accent: #ec4899; }
        body.theme-red { --accent: #ef4444; }
        body.theme-cyber { --accent: #00f2ff; }

        body {
            background-color: var(--vlc-bg);
            color: #ffffff;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            height: 100vh;
            margin: 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            user-select: none;
        }

        .accent-text { color: var(--accent); }
        .accent-bg { background-color: var(--accent); }
        
        .vlc-logo-grad {
            background: radial-gradient(circle at 30% 30%, #444 0%, #000 100%);
            position: relative;
        }
        .vlc-logo-inner {
            background: conic-gradient(from 180deg, var(--accent), #fff, var(--accent), #000, var(--accent));
            mask: radial-gradient(circle, transparent 25%, black 26%, black 85%, transparent 86%);
            -webkit-mask: radial-gradient(circle, transparent 25%, black 26%, black 85%, transparent 86%);
        }

        .nav-tab {
            padding: 14px 0;
            font-size: 10px;
            font-weight: 800;
            color: #555;
            text-transform: uppercase;
            position: relative;
            cursor: pointer;
            flex: 1;
            text-align: center;
        }
        .nav-tab.active { color: var(--accent); }
        .nav-tab.active::after {
            content: '';
            position: absolute;
            bottom: 0; left: 15%; right: 15%;
            height: 3px; background: var(--accent);
            border-radius: 3px;
        }

        .theme-dot {
            width: 32px; height: 32px; border-radius: 50%;
            cursor: pointer; border: 3px solid transparent;
        }
        .theme-dot.selected { border-color: white; transform: scale(1.1); }

        .cd-disk-outer {
            width: min(65vw, 280px);
            height: min(65vw, 280px);
            border-radius: 50%;
            background: #000;
            position: relative;
            box-shadow: 0 20px 50px rgba(0,0,0,0.9);
            animation: rotate 10s linear infinite;
            animation-play-state: paused;
        }
        .playing .cd-disk-outer { animation-play-state: running; }
        .cd-surface {
            position: absolute; inset: 2px; border-radius: 50%;
            background: repeating-radial-gradient(circle, #111 0%, #222 1%, #111 2%);
        }
        .cd-label {
            position: absolute; inset: 32%; background: var(--accent);
            border-radius: 50%; border: 5px solid #000;
            display: flex; align-items: center; justify-content: center;
        }

        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
        input[type=range]::-webkit-slider-runnable-track { height: 4px; background: #333; }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; height: 16px; width: 16px;
            border-radius: 50%; background: var(--accent); margin-top: -6px;
        }

        #full-player {
            position: fixed; top: 100%; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 100; transition: top 0.4s cubic-bezier(0.1, 0.7, 0.1, 1);
            display: flex; flex-direction: column;
        }
        #full-player.open { top: 0; }
        .btn-active { color: var(--accent) !important; }

        .list-card {
            background: #111;
            border-radius: 12px;
            padding: 12px;
            border: 1px solid #222;
        }

        #loader {
            position: fixed; inset: 0; background: rgba(0,0,0,0.8);
            z-index: 1000; display: none; flex-direction: column;
            align-items: center; justify-content: center;
        }

        #error-toast {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            background: #ef4444; color: white; padding: 12px 24px; border-radius: 12px;
            z-index: 2000; font-size: 12px; font-weight: bold; display: none;
            box-shadow: 0 10px 25px rgba(239, 68, 68, 0.4);
            max-width: 80%; text-align: center;
        }
    </style>
</head>
<body class="theme-yellow">

    <div id="loader">
        <div class="w-12 h-12 border-4 border-t-transparent border-[var(--accent)] rounded-full animate-spin mb-4"></div>
        <p class="text-xs font-black tracking-widest uppercase">Processing Media...</p>
    </div>

    <div id="error-toast"></div>

    <header class="p-4 flex justify-between items-center bg-[#111] z-10">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-full vlc-logo-grad flex items-center justify-center overflow-hidden">
                <div class="absolute inset-0 vlc-logo-inner"></div>
                <div class="w-2.5 h-2.5 bg-white rounded-full z-10"></div>
            </div>
            <div>
                <h1 class="font-black text-sm tracking-tighter">ROHANS WEB</h1>
                <p class="text-[9px] accent-text font-bold uppercase tracking-widest">Media Engine 2.0</p>
            </div>
        </div>
        <div class="flex gap-4 text-gray-500">
            <button onclick="document.getElementById('folder-input').click()" class="text-[10px] font-black border border-white/10 px-3 py-1 rounded-full hover:border-[var(--accent)] hover:text-white transition uppercase">
                Add Folder
            </button>
            <i class="fas fa-cog p-2 cursor-pointer hover:text-white" onclick="showSetup()"></i>
        </div>
    </header>

    <div class="flex bg-[#111] px-2 border-b border-white/5 shadow-lg overflow-x-auto whitespace-nowrap scrollbar-hide">
        <div class="nav-tab active" id="tab-songs" onclick="switchTab('songs')">Songs</div>
        <div class="nav-tab" id="tab-albums" onclick="switchTab('albums')">Albums</div>
        <div class="nav-tab" id="tab-artists" onclick="switchTab('artists')">Artists</div>
        <div class="nav-tab" id="tab-playlists" onclick="switchTab('playlists')">Favs</div>
    </div>

    <main id="content-view" class="flex-1 overflow-y-auto pb-32">
        <div id="setup-view" class="flex flex-col items-center justify-center min-h-[70vh] p-8 text-center">
            <div class="w-24 h-24 rounded-full vlc-logo-grad mb-8 flex items-center justify-center scale-125">
                <div class="absolute inset-0 vlc-logo-inner"></div>
                <div class="w-4 h-4 bg-white rounded-full z-10"></div>
            </div>
            <h2 class="text-2xl font-black mb-2 uppercase italic tracking-tighter">System Settings</h2>
            
            <div class="flex gap-4 my-8">
                <div class="theme-dot bg-yellow-400" id="dot-yellow" onclick="setTheme('yellow', this)"></div>
                <div class="theme-dot bg-pink-500" id="dot-pink" onclick="setTheme('pink', this)"></div>
                <div class="theme-dot bg-red-600" id="dot-red" onclick="setTheme('red', this)"></div>
                <div class="theme-dot bg-cyan-400" id="dot-cyber" onclick="setTheme('cyber', this)"></div>
            </div>

            <div class="flex flex-col gap-3 w-full max-w-xs">
                <button onclick="document.getElementById('folder-input').click()" class="accent-bg text-black font-black py-4 px-10 rounded-full tracking-widest text-xs shadow-2xl active:scale-95 transition uppercase">
                    Select Music Folder
                </button>
                <button onclick="resetLibrary()" class="bg-red-600/10 text-red-500 border border-red-600/20 font-black py-3 px-10 rounded-full tracking-widest text-[10px] active:scale-95 transition uppercase mt-4">
                    Wipe Library
                </button>
            </div>
        </div>

        <div id="songs-container" class="hidden">
            <div id="active-filter-header" class="hidden p-4 bg-white/5 flex items-center justify-between border-b border-white/10">
                <div>
                    <p id="filter-type" class="text-[8px] accent-text font-black uppercase tracking-widest">Playing From</p>
                    <h3 id="filter-name" class="text-sm font-black uppercase">Collection Name</h3>
                </div>
                <button onclick="clearFilter()" class="text-[10px] text-gray-500 hover:text-white font-bold">VIEW ALL</button>
            </div>
            <div id="songs-list"></div>
        </div>

        <div id="albums-container" class="hidden p-4 grid grid-cols-2 gap-4"></div>
        <div id="artists-container" class="hidden p-4 grid grid-cols-2 gap-4"></div>
        
        <div id="playlists-container" class="hidden p-6">
            <div class="flex justify-between items-center mb-4">
                <h3 class="font-black tracking-widest text-xs">COLLECTION</h3>
            </div>
            <div id="favorites-list" class="space-y-2">
                <p class="text-gray-600 text-xs italic">No favorites yet.</p>
            </div>
        </div>
    </main>

    <div id="mini-player" class="fixed bottom-4 left-4 right-4 h-16 bg-[#1a1a1a] rounded-2xl border border-white/10 flex items-center px-4 hidden shadow-2xl z-50" onclick="toggleFullPlayer(true)">
        <div class="w-10 h-10 rounded-lg accent-bg flex items-center justify-center mr-3 overflow-hidden">
            <i class="fas fa-music text-black"></i>
        </div>
        <div class="flex-1 min-w-0">
            <p id="mini-title" class="text-sm font-bold truncate">Title</p>
            <p id="mini-artist" class="text-[10px] text-gray-500 uppercase font-bold">Artist</p>
        </div>
        <div class="flex items-center gap-4 ml-4" onclick="event.stopPropagation()">
            <button id="mini-play-btn" class="text-xl accent-text w-10 h-10 flex items-center justify-center"><i class="fas fa-play"></i></button>
        </div>
    </div>

    <div id="full-player">
        <div class="p-6 flex items-center justify-between">
            <button onclick="toggleFullPlayer(false)" class="text-2xl text-gray-500 hover:text-white transition"><i class="fas fa-chevron-down"></i></button>
            <p class="text-[10px] font-black accent-text tracking-[0.4em] uppercase">PLAYER</p>
            <button id="fav-btn" onclick="toggleFavorite()" class="text-xl text-gray-500 hover:scale-110 transition"><i class="fas fa-heart"></i></button>
        </div>

        <div class="flex-1 flex flex-col items-center justify-center" id="player-main">
            <div class="cd-disk-outer mb-12">
                <div class="cd-surface"></div>
                <div class="cd-label">
                    <div class="w-10 h-10 bg-black rounded-full flex items-center justify-center">
                        <div class="w-3 h-3 bg-white/20 rounded-full"></div>
                    </div>
                </div>
            </div>
            <div class="text-center px-10">
                <h2 id="full-title" class="text-2xl font-black truncate mb-1">Track Title</h2>
                <p id="full-artist" class="accent-text text-xs font-bold tracking-widest uppercase opacity-70">Artist Name</p>
            </div>
        </div>

        <div class="p-10">
            <input type="range" id="seek-bar" value="0" class="mb-2">
            <div class="flex justify-between text-[10px] font-bold text-gray-600 mb-8">
                <span id="curr-time">00:00</span>
                <span id="dur-time">00:00</span>
            </div>

            <div class="flex justify-between items-center">
                <button id="shuffle-btn" class="text-lg text-gray-600" onclick="toggleShuffle()"><i class="fas fa-random"></i></button>
                <div class="flex items-center gap-8">
                    <button onclick="playPrev()" class="text-3xl hover:scale-110 transition active:scale-95"><i class="fas fa-step-backward"></i></button>
                    <button id="main-play-btn" class="w-20 h-20 accent-bg text-black rounded-full text-3xl flex items-center justify-center shadow-xl hover:scale-105 active:scale-95 transition">
                        <i class="fas fa-play"></i>
                    </button>
                    <button onclick="playNext()" class="text-3xl hover:scale-110 transition active:scale-95"><i class="fas fa-step-forward"></i></button>
                </div>
                <button id="repeat-btn" class="text-lg text-gray-600" onclick="toggleRepeat()"><i class="fas fa-redo"></i></button>
            </div>
        </div>
    </div>

    <input type="file" id="folder-input" webkitdirectory directory multiple class="hidden">

    <script>
        const jsmediatags = window.jsmediatags;
        let masterPlaylist = []; 
        let currentPlaylist = []; 
        let favorites = [];
        let albums = {};
        let artists = {};
        let currentIndex = -1;
        let isShuffle = false;
        let isRepeat = false;
        let currentTheme = 'yellow';
        
        let audio = new Audio();
        audio.preload = "auto";

        const views = {
            setup: document.getElementById('setup-view'),
            songs: document.getElementById('songs-container'),
            albums: document.getElementById('albums-container'),
            artists: document.getElementById('artists-container'),
            playlists: document.getElementById('playlists-container')
        };

        const loader = document.getElementById('loader');

        window.onload = () => {
            loadFromLocalStorage();
            if (masterPlaylist.length > 0) {
                currentPlaylist = [...masterPlaylist];
                renderAll();
                switchTab('songs');
            }
        };

        function showError(msg) {
            const toast = document.getElementById('error-toast');
            toast.innerText = msg;
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 6000);
            console.error("[PLAYER_ERROR]", msg);
        }

        function saveToLocalStorage() {
            const data = {
                theme: currentTheme,
                favorites: favorites,
                playlistMetadata: masterPlaylist.map(p => ({ 
                    name: p.name, 
                    artist: p.artist, 
                    album: p.album 
                }))
            };
            localStorage.setItem('rohan_player_data_v2', JSON.stringify(data));
        }

        function loadFromLocalStorage() {
            const saved = localStorage.getItem('rohan_player_data_v2');
            if (!saved) {
                setTheme('yellow', document.getElementById('dot-yellow'));
                return;
            }
            const data = JSON.parse(saved);
            currentTheme = data.theme || 'yellow';
            setTheme(currentTheme, document.getElementById(`dot-${currentTheme}`));
            favorites = data.favorites || [];
            if (data.playlistMetadata) {
                masterPlaylist = data.playlistMetadata;
                rebuildIndices();
            }
            renderPlaylists();
        }

        function rebuildIndices() {
            albums = {};
            artists = {};
            masterPlaylist.forEach(track => {
                const alb = track.album || "Unknown Album";
                const art = track.artist || "Unknown Artist";
                if (!albums[alb]) albums[alb] = [];
                if (!artists[art]) artists[art] = [];
                albums[alb].push(track);
                artists[art].push(track);
            });
        }

        function setTheme(theme, el) {
            currentTheme = theme;
            document.body.className = `theme-${theme}`;
            document.querySelectorAll('.theme-dot').forEach(d => d.classList.remove('selected'));
            if (el) el.classList.add('selected');
            saveToLocalStorage();
        }

        function showSetup() {
            Object.values(views).forEach(v => v.classList.add('hidden'));
            views.setup.classList.remove('hidden');
        }

        function toggleFullPlayer(open) {
            document.getElementById('full-player').classList.toggle('open', open);
        }

        function switchTab(tab) {
            if (masterPlaylist.length === 0) return;
            Object.values(views).forEach(v => v.classList.add('hidden'));
            views[tab].classList.remove('hidden');
            document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
            const tabEl = document.getElementById(`tab-${tab}`);
            if(tabEl) tabEl.classList.add('active');
        }

        function resetLibrary() {
            masterPlaylist = [];
            currentPlaylist = [];
            albums = {};
            artists = {};
            favorites = [];
            currentIndex = -1;
            audio.pause();
            audio.src = '';
            document.getElementById('mini-player').classList.add('hidden');
            saveToLocalStorage();
            renderAll();
            showSetup();
        }

        async function processFiles(files) {
            loader.style.display = 'flex';
            const audioFiles = files.filter(f => f.type.startsWith('audio/'));
            
            if (audioFiles.length === 0) {
                loader.style.display = 'none';
                showError("No valid audio files found in selected folder.");
                return;
            }

            for (let file of audioFiles) {
                const fileName = file.name.replace(/\.[^/.]+$/, "");
                const track = {
                    file: file,
                    name: fileName,
                    artist: "Unknown Artist",
                    album: "Unknown Album",
                    type: file.type || 'audio/mpeg'
                };

                try {
                    await new Promise((resolve) => {
                        jsmediatags.read(file, {
                            onSuccess: (tag) => {
                                track.artist = tag.tags.artist || "Unknown Artist";
                                track.album = tag.tags.album || "Unknown Album";
                                resolve();
                            },
                            onError: () => resolve()
                        });
                    });
                } catch(e) {}
                masterPlaylist.push(track);
            }

            currentPlaylist = [...masterPlaylist];
            rebuildIndices();
            saveToLocalStorage();
            renderAll();
            loader.style.display = 'none';
            if (masterPlaylist.length > 0 && currentIndex === -1) loadTrack(0);
            switchTab('songs');
        }

        function renderAll() {
            renderSongs();
            renderAlbums();
            renderArtists();
            renderPlaylists();
        }

        function filterByAlbum(name) {
            currentPlaylist = albums[name];
            document.getElementById('active-filter-header').classList.remove('hidden');
            document.getElementById('filter-type').innerText = "Album";
            document.getElementById('filter-name').innerText = name;
            renderSongs();
            switchTab('songs');
        }

        function filterByArtist(name) {
            currentPlaylist = artists[name];
            document.getElementById('active-filter-header').classList.remove('hidden');
            document.getElementById('filter-type').innerText = "Artist";
            document.getElementById('filter-name').innerText = name;
            renderSongs();
            switchTab('songs');
        }

        function clearFilter() {
            currentPlaylist = [...masterPlaylist];
            document.getElementById('active-filter-header').classList.add('hidden');
            renderSongs();
        }

        function renderSongs() {
            const list = document.getElementById('songs-list');
            list.innerHTML = '';
            currentPlaylist.forEach((t, i) => {
                const item = document.createElement('div');
                item.className = `flex items-center p-4 border-b border-white/5 active:bg-white/5 cursor-pointer ${currentIndex === i ? 'bg-white/5' : ''}`;
                item.onclick = () => loadTrack(i);
                item.innerHTML = `
                    <div class="w-10 h-10 rounded bg-[#222] flex items-center justify-center mr-4">
                        <i class="fas ${currentIndex === i ? 'fa-volume-up accent-text' : 'fa-music text-gray-700'}"></i>
                    </div>
                    <div class="flex-1 min-w-0">
                        <p class="font-bold text-sm truncate">${t.name}</p>
                        <p class="text-[10px] text-gray-500 uppercase font-bold">${t.artist}</p>
                    </div>
                `;
                list.appendChild(item);
            });
        }

        function renderAlbums() {
            views.albums.innerHTML = '';
            Object.keys(albums).sort().forEach(name => {
                const card = document.createElement('div');
                card.className = "list-card flex flex-col items-center text-center cursor-pointer active:scale-95 transition";
                card.onclick = () => filterByAlbum(name);
                card.innerHTML = `
                    <div class="w-full aspect-square bg-[#222] rounded-lg mb-2 flex items-center justify-center border border-white/5">
                        <i class="fas fa-compact-disc text-3xl opacity-20 accent-text"></i>
                    </div>
                    <p class="text-[10px] font-black truncate w-full uppercase tracking-tighter">${name}</p>
                    <p class="text-[8px] text-gray-500 font-bold tracking-widest uppercase">${albums[name].length} Tracks</p>
                `;
                views.albums.appendChild(card);
            });
        }

        function renderArtists() {
            views.artists.innerHTML = '';
            Object.keys(artists).sort().forEach(name => {
                const card = document.createElement('div');
                card.className = "list-card flex flex-col items-center text-center cursor-pointer active:scale-95 transition";
                card.onclick = () => filterByArtist(name);
                card.innerHTML = `
                    <div class="w-full aspect-square bg-[#222] rounded-full mb-2 flex items-center justify-center border border-white/5 overflow-hidden">
                        <i class="fas fa-user text-3xl opacity-10 accent-text"></i>
                    </div>
                    <p class="text-[10px] font-black truncate w-full uppercase tracking-tighter">${name}</p>
                    <p class="text-[8px] text-gray-500 font-bold tracking-widest uppercase">${artists[name].length} Tracks</p>
                `;
                views.artists.appendChild(card);
            });
        }

        function loadTrack(index) {
            const track = currentPlaylist[index];
            if (!track || !track.file) {
                showError("The original file connection was lost. Please re-import the folder.");
                return;
            }

            currentIndex = index;

            // Resetting audio source strictly
            if (audio.src) {
                URL.revokeObjectURL(audio.src);
            }

            // Fallback for strict browser MIME-checking: Force blob to match reported type
            const blob = new Blob([track.file], { type: track.type || 'audio/mpeg' });
            const blobUrl = URL.createObjectURL(blob);
            
            // Re-initializing Audio object can help with "NotSupportedError" in some sandboxed environments
            audio.pause();
            audio.removeAttribute('src');
            audio.load();
            
            audio.src = blobUrl;

            document.getElementById('mini-title').innerText = track.name;
            document.getElementById('full-title').innerText = track.name;
            document.getElementById('mini-artist').innerText = track.artist;
            document.getElementById('full-artist').innerText = track.artist;
            document.getElementById('mini-player').classList.remove('hidden');

            const playPromise = audio.play();

            if (playPromise !== undefined) {
                playPromise.then(() => {
                    updateUI(true);
                }).catch(err => {
                    updateUI(false);
                    if (err.name === 'NotAllowedError') {
                        showError("Playback blocked by browser. Click Play to start.");
                    } else if (err.name === 'NotSupportedError') {
                        showError("Format error: The browser cannot decode this file (" + track.type + ").");
                    } else {
                        showError("Play Error: " + err.message);
                    }
                });
            }

            updateFavUI();
            renderSongs();
        }

        function updateUI(playing) {
            const icon = playing ? 'fa-pause' : 'fa-play';
            document.getElementById('main-play-btn').innerHTML = `<i class="fas ${icon}"></i>`;
            document.getElementById('mini-play-btn').innerHTML = `<i class="fas ${icon}"></i>`;
            document.getElementById('player-main').classList.toggle('playing', playing);
        }

        function playNext() {
            if (currentPlaylist.length === 0) return;
            let nextIndex = isShuffle ? Math.floor(Math.random() * currentPlaylist.length) : (currentIndex + 1) % currentPlaylist.length;
            loadTrack(nextIndex);
        }

        function playPrev() {
            if (currentPlaylist.length === 0) return;
            let prevIndex = (currentIndex - 1 + currentPlaylist.length) % currentPlaylist.length;
            loadTrack(prevIndex);
        }

        function toggleShuffle() { 
            isShuffle = !isShuffle; 
            document.getElementById('shuffle-btn').classList.toggle('btn-active', isShuffle); 
        }
        function toggleRepeat() { 
            isRepeat = !isRepeat; 
            document.getElementById('repeat-btn').classList.toggle('btn-active', isRepeat); 
        }

        document.getElementById('folder-input').onchange = (e) => processFiles(Array.from(e.target.files));
        
        document.getElementById('main-play-btn').onclick = () => { 
            if (audio.paused) {
                audio.play().then(() => updateUI(true)).catch(e => showError("Play Error: " + e.message));
            } else {
                audio.pause();
                updateUI(false);
            }
        };

        document.getElementById('mini-play-btn').onclick = (e) => { 
            e.stopPropagation(); 
            document.getElementById('main-play-btn').click(); 
        };

        audio.ontimeupdate = () => {
            if (!audio.duration || isNaN(audio.duration)) return;
            document.getElementById('seek-bar').value = (audio.currentTime / audio.duration) * 100;
            document.getElementById('curr-time').innerText = formatTime(audio.currentTime);
            document.getElementById('dur-time').innerText = formatTime(audio.duration);
        };

        document.getElementById('seek-bar').oninput = (e) => {
            if (!audio.duration || isNaN(audio.duration)) return;
            audio.currentTime = (e.target.value / 100) * audio.duration;
        };

        audio.onended = () => isRepeat ? (audio.currentTime = 0, audio.play()) : playNext();

        audio.onerror = (e) => {
            let errorMsg = "Critical Audio Error.";
            const code = audio.error ? audio.error.code : 0;
            if (code === 1) errorMsg = "Playback Aborted.";
            else if (code === 2) errorMsg = "Connection/Network Error.";
            else if (code === 3) errorMsg = "Decoding Failed. Try another file format.";
            else if (code === 4) errorMsg = "Audio format not supported in this environment.";
            showError(errorMsg);
            updateUI(false);
        };

        function formatTime(s) { 
            if (isNaN(s)) return "00:00"; 
            const m = Math.floor(s/60); 
            const sc = Math.floor(s%60); 
            return `${m.toString().padStart(2,'0')}:${sc.toString().padStart(2,'0')}`; 
        }
        
        // Favorites logic
        function toggleFavorite() {
            if (currentIndex === -1) return;
            const track = currentPlaylist[currentIndex];
            const idx = favorites.findIndex(f => f.name === track.name);
            if (idx === -1) favorites.push({ name: track.name, artist: track.artist });
            else favorites.splice(idx, 1);
            updateFavUI();
            renderPlaylists();
            saveToLocalStorage();
        }

        function updateFavUI() {
            if (currentIndex === -1) return;
            const isFav = favorites.some(f => f.name === currentPlaylist[currentIndex].name);
            document.getElementById('fav-btn').className = `text-xl transition ${isFav ? 'accent-text' : 'text-gray-500'}`;
        }

        function renderPlaylists() {
            const list = document.getElementById('favorites-list');
            if (favorites.length === 0) { list.innerHTML = `<p class="text-gray-600 text-xs italic">No items.</p>`; return; }
            list.innerHTML = favorites.map(f => `
                <div class="p-3 bg-white/5 rounded-lg text-sm font-bold flex justify-between items-center">
                    <div>
                        <p class="truncate">${f.name}</p>
                        <p class="text-[9px] text-gray-600 uppercase">${f.artist}</p>
                    </div>
                    <i class="fas fa-heart accent-text"></i>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
